version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: leetcode_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: leetcode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leetcode_network

  backend:
    build: .
    container_name: leetcode_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the Docker network containers reach each other by service
      # name, not "localhost" - this overrides whatever DATABASE_URL is
      # set to in .env (which is meant for running the backend directly
      # on your host machine, outside Docker).
      DATABASE_URL: postgresql://postgres:1234@postgres:5432/leetcode_db
      # If/when the code-execution runner service (owned by the Docker
      # teammate) joins this network, point this at its service name,
      # e.g. http://runner:9000
      RUNNER_URL: ${RUNNER_URL:-http://runner:9000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leetcode_network

volumes:
  postgres_data:

networks:
  leetcode_network:
    driver: bridge
